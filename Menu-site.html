<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/Menu-style.css">
  <title>Document</title>
</head>
<body>
  <div class="menu-display">
    <div class="bar">
      <div class="bar-header">
        <button class="back-button">←</button>
        <p>Choose Menu</p>
      </div>
      <div class="bar-header">
        <input type="text" class="search-bar" placeholder="Search for food">
        <img src="./icons/search_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="search" class="search-icon">
      </div>


    </div>

    <div class="container">
      <div class="food-category">
        <div class="food-category-card" id="all">
          <h2>All Menu</h2>
          <p class="total-courses"></p>
        </div>
        <div class="food-category-card" id="main-courses">
          <h2>Main Courses</h2>
          <p class="total-main-courses">45 items</p>
        </div>
        <div class="food-category-card" id="fast-food">
          <h2>Fast Food</h2>
          <p class="total-fast-food">67 items</p>
        </div>
        <div class="food-category-card" id="desserts">
          <h2>Desserts</h2>
          <p class="total-dessert">32 items</p>
        </div>
      </div>

      <div class="food-display">
      </div>
    </div>
  </div>


  <div class="recept-section">
    <div class="account-section">
      <div class="acc-info">
        <div>
          <h2>Aung Kaung Myat</h2>
          <p>Order a925 / Dine in</p>
        </div>
        <div class="account-img">A</div>
      </div>
      
      <div class="active-time">
        <p class="real-time-display"></p>
      </div>

    </div>
      
    <div class="order-detail">
      <h2 class="order-detail-title">Order Details</h2>
      <div class="order-card-container">
      </div>

    </div>

    <div class="order-total">
      <div class="total-items">
        <h3>Items(5)</h3>
        <p>$12.99</p>
      </div>
      <div class="total-tax">
        <h3>Tax</h3>
        <p>$1.30</p>
      </div>   
    </div>
    <button class="checkout-button"><span class="total-amount">$14.29</span> Proceed Order → </button>
  </div>
  <div class="add-order-detail" style="display: none;">
    <textarea id="message" name="message" placeholder="Type special instructions here..."></textarea>
    <button class="add-detail-btn">Add Order details</button>
    <button class="close-detail-btn" type="button">Cancel</button>
  </div>

  <script type="module"  src="./script/Menu.js"></script>
</body>
</html>
